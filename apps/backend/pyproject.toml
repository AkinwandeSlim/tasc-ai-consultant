[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tasc-backend"
version = "1.0.0"
description = "Trizen AI Solutions Consultant — FastAPI Backend"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Trizen Ventures"},
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pydantic-extra-types>=2.9.0",
    "httpx>=0.27.0",
    "openai>=1.50.0",
    "chromadb>=0.5.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
    "python-multipart>=0.0.12",
    "ulid-py>=1.1.0",
    "sentry-sdk>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "factory-boy>=3.3.0",
    "pytest-benchmark>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["E501"]
"app/domain/extraction/*" = ["E501"]
"app/domain/recommendation/ranker.py" = ["E501"]
"app/domain/simulation/scenarios.py" = ["E501"]
"app/api/v1/chat.py" = ["E501"]
"app/orchestration/stages.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_any_unimported = false
disable_error_code = [
    "type-arg",          # Pre-3.9 dict/list generic syntax
    "no-any-return",     # Dynamic injection pattern in FastAPI Depends
    "arg-type",          # FastAPI handler type compatibility
    "var-annotated",     # Complex nested dicts without annotations
    "assignment",        # Config SecretStr coercion
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "coverage_html"
