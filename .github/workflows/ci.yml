# =============================================================================
# TASC CI — Continuous Integration Pipeline
# =============================================================================
# Runs on push and pull request to main. Validates both backend and frontend.
# Reference: Implementation Constitution Section 15 (Testing Constitution)
# =============================================================================

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # --- Backend CI -----------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check app/ tests/

      - name: Type check with mypy
        run: mypy app/ --strict

      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=app --cov-report=term

      - name: Run integration tests
        run: pytest tests/integration/ -v --cov=app --cov-append

      - name: Check import boundaries
        run: |
          # Verify domain does not import infrastructure
          ! grep -r "from app.infrastructure" app/domain/ --include="*.py" 2>/dev/null
          ! grep -r "import openai" app/domain/ --include="*.py" 2>/dev/null
          ! grep -r "import chromadb" app/domain/ --include="*.py" 2>/dev/null
          ! grep -r "import httpx" app/domain/ --include="*.py" 2>/dev/null

  # --- Frontend CI ----------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check with TypeScript
        run: npx tsc --noEmit

      - name: Lint with ESLint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  # --- Contract Tests -------------------------------------------------------
  contract:
    name: Contract Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify .env.example is valid
        run: |
          # Check .env.example has all expected variables
          if grep -q "\[REQUIRED\]" .env.example; then
            echo "WARNING: .env.example has unconfigured required variables"
          fi
          echo ".env.example check passed"

      - name: Verify dependency alignment
        run: |
          # Check that docker-compose services have corresponding Dockerfiles
          echo "Verifying Docker service alignment..."
          ls docker/backend/Dockerfile
          ls docker/frontend/Dockerfile
          echo "Docker alignment check passed"
